<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formulario de Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-warning bg-gradient">

  <!-- Encabezado -->
  <header class="bg-primary text-white text-center py-4 mb-4 shadow">
    <h1 class="h3 m-0">Registro de Usuario</h1>
  </header>

  <!-- Contenido principal -->
  <main class="container">
    <section class="row justify-content-center">
      <div class="col-md-8">
        <div class="card border-info shadow mb-4">
          <div class="card-header bg-info text-white text-center">
            <h2 class="mb-0">Formulario de Registro</h2>
          </div>
          <div class="card-body bg-light">

            <form id="formulario" novalidate>
              <div class="mb-3">
                <label for="usuario" class="form-label text-primary">Usuario</label>
                <input type="text" class="form-control border-primary" id="usuario" placeholder="Ingrese su usuario">
                <div class="text-danger" id="errorUsuario"></div>
              </div>

              <div class="mb-3">
                <label for="contrasena" class="form-label text-success">Contraseña</label>
                <input type="password" class="form-control border-success" id="contrasena" placeholder="Ingrese su contraseña">
                <div class="text-danger" id="errorContrasena"></div>
              </div>

              <div class="mb-3">
                <label for="confirmar" class="form-label text-success">Confirmar Contraseña</label>
                <input type="password" class="form-control border-success" id="confirmar" placeholder="Confirme su contraseña">
                <div class="text-danger" id="errorConfirmar"></div>
              </div>

              <div class="mb-3">
                <label for="direccion" class="form-label text-warning">Dirección</label>
                <input type="text" class="form-control border-warning" id="direccion" placeholder="Ingrese su dirección">
                <div class="text-danger" id="errorDireccion"></div>
              </div>

              <div class="mb-3">
                <label for="comuna" class="form-label text-danger">Comuna</label>
                <select class="form-select border-danger" id="comuna">
                  <option value="">Seleccione una comuna...</option>
                  <option value="Las Animas">Las Animas</option>
                  <option value="Independencia">Independencia</option>
                  <option value="Las Condes">Las Condes</option>
                </select>
                <div class="text-danger" id="errorComuna"></div>
              </div>

              <div class="mb-3">
                <label for="telefono" class="form-label text-info">Teléfono</label>
                <input type="text" class="form-control border-info" id="telefono" placeholder="Ingrese su número de teléfono">
                <div class="text-danger" id="errorTelefono"></div>
              </div>

              <div class="mb-3">
                <label for="url" class="form-label text-dark">Página Web</label>
                <input type="text" class="form-control border-dark" id="url" placeholder="Ingrese su sitio web">
                <div class="text-danger" id="errorUrl"></div>
              </div>

              <div class="mb-3">
                <label for="aficion" class="form-label text-secondary">Aficiones</label>
                <div class="input-group">
                  <input type="text" id="aficion" class="form-control border-secondary" placeholder="Ej: leer, correr, pintar">
                  <button type="button" id="agregarAficion" class="btn btn-secondary">Agregar</button>
                </div>
                <ul id="listaAficiones" class="list-group mt-2 mb-3"></ul>
                <small id="errorAficiones" class="text-danger"></small>
              </div>

                <button type="submit" class="btn btn-success">✅ Registrar</button>
            </form>

          </div>
        </div>
      </div>
    </section>

    <section class="row justify-content-center mb-4">
      <div class="col-md-8">
        <div class="card border-secondary shadow">
          <div class="card-header bg-secondary text-white text-center">
            <h3 class="mb-0">Usuarios Registrados</h3>
          </div>
          <div class="card-body bg-white">
            <ul id="Registro" class="list-group"></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="src/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
